<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oráculo Sombra · Tarô terapêutico</title>
<link href="https://fonts.googleapis.com/css2?family=Almendra:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--night:#12152a;--night2:#1b2040;--parch:#ece2c9;--parch2:#d8caa4;--ink:#1e1a14;--rose:#c98a93;--brass:#c2a465;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:radial-gradient(ellipse 900px 600px at 50% -80px,rgba(120,90,170,.3),transparent 70%),radial-gradient(ellipse 700px 500px at 100% 60%,rgba(140,47,61,.18),transparent 70%),radial-gradient(1.5px 1.5px at 12% 18%,rgba(255,255,255,.55),transparent),radial-gradient(1px 1px at 78% 9%,rgba(255,255,255,.6),transparent),radial-gradient(1.5px 1.5px at 55% 32%,rgba(255,255,255,.4),transparent),radial-gradient(1px 1px at 90% 46%,rgba(255,255,255,.5),transparent),radial-gradient(1px 1px at 25% 62%,rgba(255,255,255,.4),transparent),radial-gradient(1.5px 1.5px at 68% 80%,rgba(255,255,255,.35),transparent),radial-gradient(1px 1px at 8% 90%,rgba(255,255,255,.5),transparent),var(--night);background-repeat:no-repeat;background-attachment:fixed;color:var(--parch);font:400 1.05rem/1.65 'EB Garamond',Georgia,serif;overflow-x:hidden}
h1,h2,h3,.disp{font-family:'Almendra',Georgia,serif;font-weight:400;line-height:1.15;margin:0}
a{color:inherit}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;justify-content:space-between;align-items:center;padding:10px clamp(18px,5vw,56px);background:rgba(18,21,42,.9);backdrop-filter:blur(8px);border-bottom:1px solid rgba(194,164,101,.3)}
nav .brand{display:flex;align-items:center;gap:11px;text-decoration:none}.brand svg{width:30px;height:30px;flex:none;filter:drop-shadow(0 0 6px rgba(194,164,101,.55))}.brand .l1{font-style:italic;font-size:.95rem;letter-spacing:.16em;color:var(--parch);opacity:.72}.brand .l2{font-family:'Almendra',serif;font-size:1.5rem;letter-spacing:.05em;line-height:1;background:linear-gradient(180deg,#f6e2a6,#b8954d);-webkit-background-clip:text;background-clip:text;color:transparent}.brand .l1+.l2{margin-left:-4px}
nav div{display:flex;gap:clamp(12px,3vw,28px);font-size:1rem}
nav div a{text-decoration:none;opacity:.85}nav div a:hover{opacity:1;color:var(--brass)}
section{padding:clamp(40px,6vw,72px) clamp(18px,5vw,56px)}
.wrap{max-width:820px;margin:0 auto}
/* hero: arched parchment panel, like the flyer */
.hero{padding-top:clamp(24px,4vw,44px)}
.arch{max-width:600px;margin:0 auto;background:radial-gradient(ellipse at 50% 0,#f5eed9,var(--parch) 55%,#dccfa9);color:var(--ink);text-align:center;animation:rise 1.2s ease both;border-radius:999px 999px 10px 10px/ 200px 200px 10px 10px;padding:clamp(52px,7vw,76px) clamp(22px,6vw,56px) clamp(32px,5vw,48px);box-shadow:0 0 0 1px var(--brass),0 0 0 9px var(--night),0 0 0 10px var(--brass),0 0 90px rgba(194,164,101,.24)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.moons{display:flex;gap:14px;justify-content:center;align-items:center;margin-bottom:24px}.moons::before,.moons::after{content:"✦";color:#7b5f2c;font-size:.8rem}
.m{width:15px;height:15px;border-radius:50%;border:1.2px solid #7b5f2c}
.m2{background:linear-gradient(90deg,transparent 50%,#7b5f2c 50%)}.m3{background:#7b5f2c}.m4{background:linear-gradient(270deg,transparent 50%,#7b5f2c 50%)}
.arch h1{font-size:clamp(2.1rem,6vw,3.2rem);letter-spacing:.03em;text-shadow:0 1px 0 rgba(255,255,255,.55);margin-bottom:6px}
.lema{font-style:italic;font-size:1.1rem;color:#6b3a43;margin:0 0 20px}
.arch::before{content:"";position:absolute;inset:9px;border:1px solid rgba(123,95,44,.38);border-radius:inherit;pointer-events:none}
.arch p.intro{max-width:44ch;font-size:1rem;margin:0 auto 24px}
.btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-block;padding:10px 22px;border:1px solid var(--ink);border-radius:3px;text-decoration:none;font-size:.98rem}
.btn.f{background:var(--ink);color:var(--parch)}.btn.f:hover{background:#3a2f22}.btn:not(.f):hover{background:rgba(30,26,20,.08)}
h2{font-size:clamp(1.5rem,3.2vw,2rem);color:var(--brass);margin-bottom:20px}
.cards{display:flex;justify-content:center;align-items:flex-start;gap:clamp(8px,2.4vw,28px);padding-top:0;padding-bottom:clamp(44px,7vw,84px)}
.tc{width:min(18vw,150px);transform:rotate(var(--r)) translateY(var(--y));transition:transform .45s ease,filter .45s ease;filter:drop-shadow(0 14px 24px rgba(0,0,0,.55))}
.tc:hover{transform:rotate(0) translateY(-12px);filter:drop-shadow(0 0 24px rgba(194,164,101,.5))}
.tc svg{display:block;width:100%;height:auto}
.sky{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.s0{animation:tw 7s ease-in-out -3s infinite alternate}.s1{animation:tw 4.5s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.3}to{opacity:1}}
/* about */
.ab{display:grid;grid-template-columns:.8fr 1.2fr;gap:clamp(28px,6vw,64px);align-items:start}
.pic{position:relative;aspect-ratio:4/5;border:1px solid var(--brass);border-radius:999px 999px 6px 6px/ 200px 200px 6px 6px;background:var(--night2);overflow:hidden;display:grid;place-items:center;font-size:3rem;color:var(--brass);box-shadow:0 0 0 6px var(--night),0 0 0 7px rgba(194,164,101,.6),0 0 50px rgba(194,164,101,.16)}
.pic img{width:100%;height:100%;object-fit:cover}
.txt{white-space:pre-line;max-width:58ch}
ul.pts{list-style:none;padding:0;margin:26px 0 0;border-top:1px solid rgba(194,164,101,.35)}
ul.pts li{padding:9px 0 9px 28px;border-bottom:1px solid rgba(194,164,101,.35);position:relative}
ul.pts li::before{content:"☾";position:absolute;left:0;color:var(--brass)}
/* prices on parchment */
.paper{background:radial-gradient(ellipse at 50% 0,#f5eed9,var(--parch) 60%);color:var(--ink);padding:clamp(40px,6vw,64px) clamp(18px,5vw,56px);box-shadow:inset 0 0 0 12px var(--parch),inset 0 0 0 13px rgba(107,58,67,.45)}
.paper h2{color:#6b3a43}
h2{letter-spacing:.03em;text-align:center;text-shadow:0 0 24px rgba(194,164,101,.35)}h2::after{content:"✦";display:block;margin:14px auto 0;width:min(280px,80%);text-align:center;font-size:.75rem;line-height:1;color:var(--o,var(--brass));background:linear-gradient(90deg,transparent,var(--o,var(--brass)) 22%,transparent 43%,transparent 57%,var(--o,var(--brass)) 78%,transparent) center/100% 1px no-repeat}.paper h2{--o:#6b3a43;text-shadow:none}
ul.rules{margin:0 auto}
nav{box-shadow:0 1px 26px rgba(194,164,101,.14)}
.btn.f{background:linear-gradient(135deg,#2c2318,#1e1a14);box-shadow:0 0 0 1px rgba(194,164,101,.65),0 8px 24px -8px rgba(194,164,101,.55)}.contact .btn.f{background:linear-gradient(135deg,#e4c878,#c2a465);box-shadow:0 0 30px -4px rgba(194,164,101,.6)}
.row{transition:background .3s}.row:hover{background:rgba(107,58,67,.08)}
.paper{position:relative;width:calc(100% - 44px);max-width:620px;margin:clamp(20px,4vw,44px) auto;border-radius:999px 999px 10px 10px/150px 150px 10px 10px;padding:clamp(52px,7vw,72px) clamp(24px,5vw,52px) clamp(32px,5vw,48px);box-shadow:0 0 0 1px var(--brass),0 0 0 9px var(--night),0 0 0 10px var(--brass),0 0 80px rgba(194,164,101,.2)}
.paper::before{content:"";position:absolute;inset:9px;border:1px solid rgba(123,95,44,.38);border-radius:inherit;pointer-events:none}
.sub{text-align:center;font-style:italic;opacity:.75;margin:-6px 0 20px}
.row,.row:first-of-type{border:0}.row{padding:9px 0;gap:10px}.row>div:first-child{flex:1;min-width:0}
.row .n{display:flex;align-items:baseline;gap:10px}.row .n::after{content:"";flex:1;border-bottom:1px dotted rgba(107,58,67,.55);transform:translateY(-4px)}
.row:has(.d){padding:14px 18px;margin:8px 0;border:1px solid rgba(107,58,67,.4);border-radius:6px;background:rgba(107,58,67,.05)}
.hero{position:relative;overflow-x:clip}.arch{position:relative;z-index:1}
.ring{position:absolute;left:50%;top:50%;width:min(820px,150vw);aspect-ratio:1;transform:translate(-50%,-50%);opacity:.34;animation:spin 320s linear infinite;pointer-events:none}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.dep blockquote::before{content:"“";display:block;font-family:'Almendra',serif;font-size:3rem;line-height:.6;color:var(--brass)}
.row{position:relative;display:flex;justify-content:space-between;align-items:baseline;gap:24px;padding:14px 0;border-bottom:1px solid rgba(30,26,20,.28)}
.row:first-of-type{border-top:1px solid rgba(30,26,20,.28)}
.row .n{font-family:'Almendra',serif;font-size:1.2rem}.row .d{font-size:.9rem;opacity:.8;margin-top:2px;max-width:46ch;line-height:1.5}
.row .p{font-family:'Almendra',serif;font-size:1.3rem;white-space:nowrap;color:#6b3a43}
/* lists */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.gal figure{position:relative;margin:0;aspect-ratio:1;border:1px solid var(--brass);border-radius:4px;overflow:hidden}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.dep{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.dep blockquote{position:relative;margin:0;padding:26px 24px;border:1px solid rgba(194,164,101,.45);border-radius:4px;background:var(--night2)}
.dep cite{display:block;margin-top:14px;font-style:normal;color:var(--brass);font-family:'Almendra',serif}
ul.rules{padding:0;margin:0;list-style:none;max-width:68ch}
ul.rules li{position:relative;padding:9px 0 9px 28px;border-bottom:1px solid rgba(194,164,101,.3)}
ul.rules li::before{content:"✦";position:absolute;left:0;color:var(--brass);font-size:.8rem;top:17px}
.contact{text-align:center}
.contact h2{max-width:20ch;margin:0 auto 14px}.contact p{max-width:48ch;margin:0 auto 28px;opacity:.9}
.contact .btn{border-color:var(--brass)}.contact .btn.f{background:var(--brass);color:var(--ink)}.contact .btn:not(.f):hover{background:rgba(194,164,101,.14)}
footer{text-align:center;padding:30px 20px calc(30px + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(194,164,101,.3);font-size:.95rem;opacity:.8}
/* edit mode */
.x{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;background:#8c2f3d;color:#fff;font-size:1.1rem;line-height:1;cursor:pointer;z-index:2}
.row .x{top:50%;right:-6px;transform:translateY(-50%)}
.add,.up{display:inline-block;margin-top:16px;padding:9px 18px;border:1px dashed currentColor;background:none;color:inherit;font:inherit;border-radius:3px;cursor:pointer}
.pic .up{position:absolute;bottom:14px;background:var(--night);color:var(--parch);font-size:.95rem}
.editing [data-p]{outline:1px dashed rgba(201,138,147,.8);outline-offset:3px;min-width:2ch;cursor:text}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:94vw;padding:10px 14px;background:var(--night2);border:1px solid var(--brass);border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.5);font-size:.95rem}
#bar button{font:inherit;padding:8px 16px;border-radius:3px;border:1px solid var(--brass);background:none;color:var(--parch);cursor:pointer}
#bar .b1{background:var(--brass);color:var(--ink)}
footer .adm{display:block;margin-top:10px;font-size:.8rem;opacity:.4;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
@media(prefers-reduced-motion:reduce){.arch{animation:none}.sky{animation:none;opacity:.85}.ring{animation:none}}
@media(max-width:760px){.ab{grid-template-columns:1fr}.pic{max-width:300px;margin:0 auto}nav div{display:none}.row{gap:8px}.arch{border-radius:200px 200px 10px 10px/ 140px 140px 10px 10px}}
</style>
</head>

const RING=(()=>{let t='';for(let i=0;i<72;i++){const a=i*Math.PI/36,l=i%6?6:14,r=282;t+=`<path d="M${300+r*Math.cos(a)} ${300+r*Math.sin(a)}L${300+(r-l)*Math.cos(a)} ${300+(r-l)*Math.sin(a)}"/>`}const z=[...'♈♉♊♋♌♍♎♏♐♑♒♓'].map((g,i)=>`<text transform="rotate(${i*30+15} 300 300)" x="300" y="64" text-anchor="middle">${g}\uFE0E</text>`).join('');return `<svg class="ring" viewBox="0 0 600 600" aria-hidden="true" fill="none" stroke="#c2a465" stroke-width=".8"><circle cx="300" cy="300" r="292"/><circle cx="300" cy="300" r="270"/><circle cx="300" cy="300" r="200"/><circle cx="300" cy="300" r="120"/><path d="M300 100L473 400H127ZM300 500L127 200H473Z"/>${t}<g fill="#c2a465" stroke="none" font-size="22" font-family="serif">${z}</g></svg>`})();
const logo=n=>{const p=String(n).split(' '),a=p.length>1?p.shift():'';return `<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14.5" fill="none" stroke="#c2a465" stroke-width="1"/><circle cx="16" cy="16" r="11.5" fill="none" stroke="#c2a465" stroke-width=".5" stroke-opacity=".6"/><path d="M19 7.5a9 9 0 1 0 0 17a7 7 0 1 1 0-17z" fill="#c2a465"/><path d="M23 9l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z" fill="#f6e2a6"/></svg>${a?`<span class="l1">${esc(a)}</span>`:''}<span class="l2">${esc(p.join(' '))}</span>`};
function R(){
const w=S.whats.replace(/\D/g,''),wa='https://wa.me/'+(w.startsWith('55')&&w.length>11?w:'55'+w),ig='https://instagram.com/'+S.insta.replace('@','');
const X=(l,i)=>edit?`<button class="x" data-act="del" data-l="${l}" data-i="${i}" aria-label="Remover">×</button>`:'';
const A=(l,t)=>edit?`<button class="add" data-act="add" data-l="${l}">${t}</button>`:'';
const up=(k,t)=>edit?`<label class="up">${t}<input type="file" accept="image/*" data-up="${k}" hidden></label>`:'';
document.body.className=edit?'editing':'';
$('#app').innerHTML=`
<nav><a class="brand" href="#inicio" aria-label="${esc(S.nome)}">${logo(S.nome)}</a><div><a href="#sobre">Sobre</a><a href="#valores">Valores</a>${S.galeria.length||edit?'<a href="#galeria">Galeria</a>':''}${S.depo.length||edit?'<a href="#depoimentos">Depoimentos</a>':''}<a href="#contato">Contato</a></div></nav>
<section class="hero" id="inicio">${RING}<div class="arch"><div class="moons" aria-hidden="true"><i class="m"></i><i class="m m2"></i><i class="m m3"></i><i class="m m4"></i><i class="m"></i></div>
${E('nome',S.nome,'h1')}${E('lema',S.lema,'p','lema')}${E('intro',S.intro,'p','intro',1)}
<div class="btns"><a class="btn f" href="#valores">Ver valores</a><a class="btn" href="${wa}" target="_blank" rel="noopener">Falar no WhatsApp</a></div></div></section>
<section class="cards" aria-label="Arcanos">${CARDS}</section>
<section id="sobre"><div class="wrap ab"><div><div class="pic">${S.foto?`<img src="${S.foto}" alt="Mesa de leitura com cartas de tarô, vela, gatos e caveira">`:'☾'}${up('foto',S.foto?'Trocar foto':'Adicionar foto')}</div></div>
<div><h2>Sobre o tarô terapêutico</h2>${E('sobre',S.sobre,'div','txt',1)}
<ul class="pts">${S.pts.map((t,i)=>`<li>${E('pts.'+i,t)}</li>`).join('')}</ul></div></div></section>
<div class="paper" id="valores"><div class="wrap"><h2>Valores</h2><p class="sub">Tipos de consulta</p>
${S.valores.map((v,i)=>`<div class="row"><div><div class="n">${E(`valores.${i}.n`,v.n)}</div>${v.d||edit?`<div class="d">${E(`valores.${i}.d`,v.d)}</div>`:''}</div><div class="p">${E(`valores.${i}.p`,v.p)}</div>${X('valores',i)}</div>`).join('')}${A('valores','+ Adicionar consulta')}</div></div>
${S.galeria.length||edit?`<section id="galeria"><div class="wrap"><h2>Galeria</h2><div class="gal">${S.galeria.map((g,i)=>`<figure><img src="${g}" alt="">${X('galeria',i)}</figure>`).join('')}</div>${up('galeria','+ Adicionar foto')}</div></section>`:''}
${S.depo.length||edit?`<section id="depoimentos"><div class="wrap"><h2>Depoimentos</h2><div class="dep">${S.depo.map((d,i)=>`<blockquote>${E(`depo.${i}.t`,d.t,'div','',1)}<cite>${E(`depo.${i}.n`,d.n)}</cite>${X('depo',i)}</blockquote>`).join('')}</div>${A('depo','+ Adicionar depoimento')}</div></section>`:''}
<section><div class="wrap"><h2>Combinados</h2><ul class="rules">${S.regras.map((t,i)=>`<li>${E('regras.'+i,t)}${X('regras',i)}</li>`).join('')}</ul>${A('regras','+ Adicionar combinado')}</div></section>
<section class="contact" id="contato"><div class="wrap"><h2>Quer começar com uma pergunta ou prefere uma leitura mais profunda?</h2><p>Me chame e combinamos o melhor formato para você.</p>
<div class="btns"><a class="btn f" href="${wa}" target="_blank" rel="noopener">WhatsApp ${E('whats',S.whats)}</a><a class="btn" href="${ig}" target="_blank" rel="noopener">Instagram ${E('insta',S.insta)}</a></div></div></section>
<footer><div style="color:var(--brass);letter-spacing:.6em;margin-bottom:8px" aria-hidden="true">☾ ✦ ☽</div>${esc(S.nome)} · ${esc(S.lema)}<a href="#" class="adm" data-act="login">Acesso da administradora</a></footer>
${can?(edit?`<div id="bar"><span id="msg">Toque nos textos para editar</span><button class="b1" data-act="save">Salvar e publicar</button><button data-act="cancel">Cancelar</button></div>`:`<div id="bar"><button class="b1" data-act="edit">Editar página</button></div>`):''}`}
function setP(p,v){const k=p.split('.');let o=S;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v}
document.addEventListener('input',e=>{const p=e.target.dataset&&e.target.dataset.p;if(p)setP(p,e.target.innerText.replace(/\n$/,''))});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.p&&!e.target.dataset.m)e.preventDefault()});
function shrink(f,max=1100){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.82))};i.src=fr.result};fr.readAsDataURL(f)})}
document.addEventListener('change',async e=>{const k=e.target.dataset&&e.target.dataset.up,f=e.target.files&&e.target.files[0];if(!k||!f)return;const d=await shrink(f);try{const r=await fetch('/api/site?a=upload',{method:'POST',headers:{'Content-Type':'text/plain','x-pw':pw},body:d});if(!r.ok)throw 0;const u=(await r.json()).url;k==='foto'?S.foto=u:S.galeria.push(u);R()}catch(e){alert('Não foi possível enviar a foto.')}});
async function pub(){const m=$('#msg');try{m.textContent='Salvando…';const r=await fetch('/api/site?a=save',{method:'POST',headers:{'Content-Type':'application/json','x-pw':pw},body:JSON.stringify(S)});if(!r.ok)throw 0;S0=JSON.stringify(S);edit=false;R()}catch(e){m.textContent='Não foi possível salvar. Tente novamente.'}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;e.preventDefault();const a=b.dataset.act,l=b.dataset.l;
if(a==='edit'){edit=true;R()}else if(a==='cancel'){S=JSON.parse(S0);edit=false;R()}
else if(a==='del'){S[l].splice(+b.dataset.i,1);R()}else if(a==='add'){S[l].push(NEW[l]());R()}else if(a==='save')pub();else if(a==='login')login()});
let lw=0;function stars(){if(innerWidth===lw)return;lw=innerWidth;[[170,0],[80,1]].forEach(([n,z])=>{let c=$('#st'+z);if(!c){c=document.createElement('canvas');c.id='st'+z;c.className='sky s'+z;document.body.insertBefore(c,document.body.firstChild)}const w=c.width=innerWidth,h=c.height=innerHeight,x=c.getContext('2d');for(let i=0;i<n;i++){const px=Math.random()*w,py=Math.random()*h,r=Math.random()*1.2+.3;x.globalAlpha=Math.random()*.55+.4;x.fillStyle=Math.random()<.15?'#e4c878':'#fff';x.beginPath();x.arc(px,py,r,0,7);x.fill();if(Math.random()<.07){x.strokeStyle=x.fillStyle;x.lineWidth=.7;x.beginPath();x.moveTo(px-7,py);x.lineTo(px+7,py);x.moveTo(px,py-7);x.lineTo(px,py+7);x.stroke()}}})}
stars();addEventListener('resize',stars);
fetch('/api/site').then(r=>r.ok?r.json():null).catch(()=>null).then(d=>{if(d&&d.nome){S=d;S0=JSON.stringify(S)}R()});
async function login(){const p=prompt('Senha da administradora:');if(!p)return;const r=await fetch('/api/site?a=check',{method:'POST',headers:{'x-pw':p}}).catch(()=>null);if(r&&r.ok){pw=p;can=true;edit=true;R()}else alert('Senha incorreta.')}
</script>
</body>
